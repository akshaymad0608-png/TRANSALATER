name: SEO checks

# The site is plain static HTML, so there is no build step: validate the files
# in place. Fails on hard errors only; warnings are reported, not gated.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seo-validate.mjs
